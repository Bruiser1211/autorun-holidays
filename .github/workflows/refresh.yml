name: Refresh official Korean holidays

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write

concurrency:
  group: holiday-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Collect and validate all years
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        run: python collect_holidays.py
      - name: Publish data and verification timestamp
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- holidays.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh verified Korean holiday data'
          git push
